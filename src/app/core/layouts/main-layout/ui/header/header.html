<header class="block-bg flex items-center justify-between px-6 py-4">
  <button
    pButton
    severity="secondary"
    (click)="sidebar.toggle()"
    class="border-none! bg-transparent! px-1.5! py-1! hover:bg-black/5! dark:hover:bg-white/5!"
  >
    <svg [lucideIcon]="icon()" [size]="21" strokeWidth="1.5"></svg>
  </button>

  <div class="flex items-center gap-3">
    <button
      pButton
      severity="secondary"
      rounded
      class="size-9! border-none! bg-transparent! p-0! hover:bg-black/5! dark:hover:bg-white/5!"
    >
      <i class="pi pi-bell text-lg!"></i>
    </button>

    <div class="flex items-center gap-3">
      <div class="flex flex-col items-end">
        <span
          class="text-surface-800 dark:text-surface-200 text-sm font-semibold"
        >
          {{ store.displayName() }}
        </span>
        <span class="text-surface-500 dark:text-surface-400 text-xs">
          {{ store.user()?.email }}
        </span>
      </div>
      <div
        class="bg-primary-100 dark:bg-primary-800 text-primary-600 dark:text-primary-200 flex h-9 w-9 items-center justify-center rounded-full text-sm font-bold"
      >
        {{ store.displayName().charAt(0).toUpperCase() }}
      </div>
    </div>
  </div>
</header>
