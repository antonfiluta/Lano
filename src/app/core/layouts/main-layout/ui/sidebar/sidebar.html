<aside
  class="block-bg flex h-full max-h-full flex-col justify-between p-4 transition-all duration-200"
  [class]="isOpen() ? 'w-64' : 'w-16'"
>
  <div>
    <app-logo [size]="isOpen() ? 'sm' : 'xs'" [onlyIcon]="!isOpen()"></app-logo>
    <app-divider class="mt-3 mb-4 block"></app-divider>

    <nav aria-label="Main navigation">
      <app-nav></app-nav>
      <app-divider class="mt-3 mb-4 block"></app-divider>
      <app-board-nav></app-board-nav>
    </nav>
  </div>

  <div>
    <app-divider class="mt-3 mb-2 block"></app-divider>
    <button
      (click)="logout()"
      class="hover:bg-surface-100/40 dark:hover:bg-surface-800/80 flex w-full items-center rounded-lg py-1 text-sm font-medium text-red-600 transition-all duration-200 dark:text-red-400"
      [class]="
        isOpen()
          ? 'my-[0.5px] gap-1.5 px-1.5 py-[5px]'
          : 'my-[5px] justify-center gap-0 px-0 py-[0.5px]'
      "
    >
      <div class="flex size-7 items-center justify-center">
        <i class="pi pi-sign-out"></i>
      </div>

      <span
        class="inline-block overflow-hidden whitespace-nowrap transition-all duration-200"
        [class]="isOpen() ? 'max-w-32 opacity-100' : 'max-w-0 opacity-0'"
      >
        Sign Out
      </span>
    </button>
  </div>
</aside>
