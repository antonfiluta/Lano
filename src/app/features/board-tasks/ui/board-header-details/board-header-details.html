<app-prime-button
  [icon]="board().icon"
  iconSize="text-lg!"
  pTooltip="Icon Picker"
  class="from-primary-400! to-primary-600! dark:from-primary-500! dark:to-primary-700! flex size-11 items-center justify-center rounded-xl! bg-linear-to-br! text-white! shadow-sm!"
  (click)="iconPicker.toggle($event)"
></app-prime-button>

<div class="flex flex-col gap-0.5" [formGroup]="editForm">
  <input
    formControlName="title"
    placeholder="New Board"
    class="text-surface-900 dark:text-surface-50 text-2xl font-semibold tracking-tight focus:outline-0"
  />
  <input
    formControlName="description"
    placeholder="Stay organized with tasks, your way."
    class="text-surface-500 dark:text-surface-400 max-w-lg text-sm leading-relaxed focus:outline-0"
  />
</div>

<p-popover #iconPicker>
  <div class="flex w-72 flex-col gap-3.5">
    <div class="flex items-center justify-between">
      <h3
        class="text-surface-700 dark:text-surface-200 text-sm font-semibold tracking-tight"
      >
        Choose icon
      </h3>

      <div class="flex items-center gap-0.5">
        <app-prime-button
          icon="sparkles"
          pTooltip="Random Icon"
          class="size-7"
          (action)="pickRandomIcon()"
        ></app-prime-button>

        <app-prime-button
          icon="trash"
          pTooltip="Remove Icon"
          class="size-7 hover:bg-red-50! hover:text-red-500! dark:hover:bg-red-900/20!"
          (action)="resetToDefaultIcon()"
        ></app-prime-button>
      </div>
    </div>

    <div class="relative">
      <i
        class="pi pi-search text-surface-400 dark:text-surface-600 absolute top-1/2 left-3 -translate-y-1/2 text-xs!"
      ></i>
      <input
        type="text"
        [(ngModel)]="iconFilter"
        placeholder="Filter icons..."
        class="border-surface-200/70 bg-surface-100/40 focus:border-primary-400 focus:ring-primary-400/20 dark:border-surface-700/60 dark:bg-surface-800/50 dark:focus:border-primary-500 text-surface-700 placeholder:text-surface-400 dark:text-surface-200 w-full rounded-lg border py-1.5 pr-3 pl-8 text-sm transition-all focus:ring-2 focus:outline-none"
      />
    </div>

    @if (iconOptions().length) {
      <div
        class="grid h-36 grid-cols-8 content-start gap-2 overflow-y-scroll pr-1"
      >
        @for (icon of iconOptions(); track icon) {
          <app-prime-button
            [icon]="icon"
            [pTooltip]="icon"
            (action)="pickIcon(icon)"
            [class]="`size-7 rounded-sm! p-0! ${
              board().icon === icon
                ? 'text-surface-900! bg-surface-800/10! dark:text-surface-100! dark:bg-surface-300/10!'
                : ''
            }`"
          ></app-prime-button>
        }
      </div>
    } @else {
      <p class="text-sm">No results</p>
    }
  </div>
</p-popover>
