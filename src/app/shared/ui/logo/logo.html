<div
  class="flex items-center transition-all duration-200"
  [class]="onlyIcon() ? 'gap-0' : 'gap-3'"
>
  <div
    class="bg-primary-500 shadow-primary-500/30 flex items-center justify-center shadow-lg transition-all duration-150"
    [class]="styles().iconSize"
  >
    <i class="pi pi-check text-white"></i>
  </div>

  <span
    class="from-primary-500 to-primary-400 inline-block overflow-hidden bg-linear-to-r bg-clip-text font-black tracking-widest whitespace-nowrap text-transparent transition-all duration-200"
    [class]="
      (onlyIcon() ? 'max-w-0 opacity-0 ' : 'max-w-40 opacity-100 ') +
      styles().fontSize
    "
  >
    LANO
  </span>
</div>
